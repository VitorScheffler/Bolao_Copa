<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolão Copa do Mundo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- TELA DE LOGIN -->
  <div id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="login-logo">
        <h1>Bolão Copa do Mundo</h1>
        <p>Fase de grupos · 12 grupos · 72 jogos</p>
      </div>

      <div class="contagem">
        <div class="contagem-item">
          <span id="contagem-dias">29</span>
          <small>Dias</small>
        </div>

        <div class="contagem-item">
          <span id="contagem-horas">06</span>
          <small>Horas</small>
        </div>

        <div class="contagem-item">
          <span id="contagem-minutos">26</span>
          <small>Minutos</small>
        </div>

        <div class="contagem-item">
          <span id="contagem-segundos">40</span>
          <small>Segundos</small>
        </div>
      </div>

      <script>
        // Primeiro jogo da Copa 2026 - 11/06/2026 às 16:00
        const dataCopa = new Date("2026-06-11T16:00:00").getTime();

        function atualizarContagem() {
          const agora = new Date().getTime();
          const diferenca = dataCopa - agora;

          if (diferenca <= 0) {
            document.getElementById("contagem-dias").innerText = "0";
            document.getElementById("contagem-horas").innerText = "00";
            document.getElementById("contagem-minutos").innerText = "00";
            document.getElementById("contagem-segundos").innerText = "00";
            return;
          }

          const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));

          const horas = Math.floor(
            (diferenca % (1000 * 60 * 60 * 24)) /
            (1000 * 60 * 60)
          );

          const minutos = Math.floor(
            (diferenca % (1000 * 60 * 60)) /
            (1000 * 60)
          );

          const segundos = Math.floor(
            (diferenca % (1000 * 60)) / 1000
          );

          document.getElementById("contagem-dias").innerText = dias;
          document.getElementById("contagem-horas").innerText =
            String(horas).padStart(2, "0");

          document.getElementById("contagem-minutos").innerText =
            String(minutos).padStart(2, "0");

          document.getElementById("contagem-segundos").innerText =
            String(segundos).padStart(2, "0");
        }

        atualizarContagem();
        setInterval(atualizarContagem, 1000);
      </script>
      <div class="login-card">
        <h2>Entrar no bolão</h2>
        <div class="field-group">
          <label>Seu nome</label>
          <input type="text" id="login-name" placeholder="Digite seu nome..." maxlength="32" autocomplete="off">
        </div>
        <button class="btn btn-primary btn-full" onclick="login()">Entrar</button>
        <div id="login-error" class="error-msg" style="display:none"></div>
      </div>
      <div class="login-users" id="login-users-list"></div>
    </div>
  </div>

  <!-- TELA PRINCIPAL -->
  <div id="screen-main" class="screen">

    <header class="main-header">
      <div class="header-left">
        <span class="app-title">Bolão Copa do Mundo</span>
      </div>
      <div class="header-center">
        <nav class="main-nav">
          <button class="nav-btn active" data-view="meus-palpites" onclick="setView('meus-palpites', this)">Meus Palpites</button>
          <button class="nav-btn" data-view="comparar" onclick="setView('comparar', this)">Comparar</button>
          <button class="nav-btn" data-view="chaveamento" onclick="setView('chaveamento', this)">Chaveamento</button>
        </nav>
      </div>
      <div class="header-right">
        <div class="user-badge" id="user-badge"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Alternar modo escuro" aria-label="Alternar modo escuro">🌙</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sair</button>
      </div>
    </header>

    <main class="main-content">

      <!-- VIEW: MEUS PALPITES -->
      <div id="view-meus-palpites" class="view active">
        <div class="view-header">
          <h2>Meus Palpites</h2>
          <div class="view-actions">
            <span id="progress-label" class="progress-label"></span>
            <button class="btn btn-primary btn-sm" onclick="saveAll()">Salvar tudo</button>
          </div>
        </div>
        <div id="groups-grid" class="groups-grid"></div>
      </div>

      <!-- VIEW: COMPARAR -->
      <div id="view-comparar" class="view">
        <div class="view-header">
          <h2>Comparar Palpites</h2>
        </div>
        <div id="compare-content"></div>
      </div>

      <!-- VIEW: CHAVEAMENTO -->
      <div id="view-chaveamento" class="view">
        <div class="view-header">
          <h2>Chaveamento</h2>
        </div>
        <div id="chaveamento-content"></div>
      </div>

    </main>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
